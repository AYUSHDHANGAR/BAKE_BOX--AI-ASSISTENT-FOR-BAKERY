    * {

    header {

      justify-content: space-between;

    }
    .logo-container {

      gap: 18px;
    }
    .logo-badge {

      font-weight: 800;
      font-size: 26px;
      letter-spacing: 2px;
      padding: 10px 22px;
      border-radius: 12px;

    .header-text h1 {

      font-weight: 700;
      color: #fff;

    .header-text p {
      color: var(--text-muted);
      font-size: 14px;

    }
    .stats-bar {

    .stat-item {

    }
    .stat-val {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-gold);
    }
    .stat-lbl {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .controls {

      padding: 0 30px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
    }
    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .filter-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);

      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s ease;

    .filter-btn:hover {

      border-radius: 8px;

      width: 280px;
      font-size: 14px;

    .flavor-pills {

      padding: 0 30px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s ease;

    .flavor-pill:hover {

      width: 100%;

      background: #111217;
      overflow: hidden;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .card:hover .img-wrap img {

    }
    .card-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 6px;
      backdrop-filter: blur(8px);

_CutleryAndDisposables_03.jpeg", "rel_path": "PARTY_AND_SNACKS/Cutlery & Disposables/BAKEBOX_CutleryAndDisposables_03.jpeg"}, {"section": "PARTY_AND_SNACKS", "category": "PARTY", "flavor": "Cutlery & Disposables", "name": "BAKEBOX_CutleryAndDisposables_04.jpeg", "rel_path": "PARTY_AND_SNACKS/Cutlery & Disposables/BAKEBOX_CutleryAndDisposables_04.jpeg"}, {"section": "PARTY_AND_SNACKS", "category": "PARTY", "flavor": "Cutlery & Disposables", "name": "BAKEBOX_CutleryAndDisposables_05.jpeg", "rel_path": "PARTY_AND_SNACKS/Cutlery & Disposables/BAKEBOX_CutleryAndDisposables_05.jpeg"}, {"section": "PARTY_AND_SNACKS", "category": "PARTY", "flavor": "Cutlery & Disposables", "name": "BAKEBOX_CutleryAndDisposables_06.jpeg", "rel_path": "PARTY_AND_SNACKS/Cutlery & Disposables/BAKEBOX_CutleryAndDisposables_06.jpeg"}, {"section": "PARTY_AND_SNACKS", "category": "PARTY", "flavor": "Cutlery & Disposables", "name": "BAKEBOX_CutleryAndDisposables_07.jpeg", "rel_path": "PARTY_AND_SNACKS/Cutlery & Disposables/BAKEBOX_CutleryAndDisposables_07.jpeg"}, {"section": "PARTY_AND_SNACKS", "category": "PARTY", "flavor": "Cutlery & Disposables", "name": "BAKEBOX_CutleryAndDisposables_08.jpeg", "rel_path": "PARTY_AND_SNACKS/Cutlery & Disposables/BAKEBOX_CutleryAndDisposables_08.jpeg"}, {"section": "PARTY_AND_SNACKS", "category": "PARTY", "flavor": "Party Poppers", "name": "BAKEBOX_PartyPoppers_01.jpeg", "rel_path": "PARTY_AND_SNACKS/Party Poppers/BAKEBOX_PartyPoppers_01.jpeg"}, {"section": "PARTY_AND_SNACKS", "category": "PARTY", "flavor": "Party Poppers", "name": "BAKEBOX_PartyPoppers_02.jpeg", "rel_path": "PARTY_AND_SNACKS/Party Poppers/BAKEBOX_PartyPoppers_02.jpeg"}, {"section": "PARTY_AND_SNACKS", "category": "PARTY", "flavor": "Party Poppers", "name": "BAKEBOX_PartyPoppers_03.jpeg", "rel_path": "PARTY_AND_SNACKS/Party Poppers/BAKEBOX_PartyPoppers_03.jpeg"}];

    const flavors = Array.from(new Set(items.map(x => x.flavor))).sort();
    const pillsContainer = document.getElementById('flavorPills');
    flavors.forEach(f => {
      const b = document.createElement('button');
      b.className = 'flavor-pill';
      b.dataset.flavor = f;
      b.innerText = f;
      pillsContainer.appendChild(b);
    });

    let activeFilter = 'all';
    let activeFlavor = 'all';
    let searchQuery = '';

    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      const filtered = items.filter(item => {
        const isCustom = ['Custom Specialty', 'Barbie Doll', 'Doraemon & Kids'].includes(item.flavor);
        if (activeFilter === 'studio' && item.section !== 'STUDIO_SHOWCASE') return false;
        if (activeFilter === 'ace' && item.category !== 'ACE') return false;
        if (activeFilter === 'premium' && (item.category !== 'PREMIUM' || isCustom)) return false;
        if (activeFilter === 'custom' && !isCustom) return false;
        if (activeFilter === 'party' && item.section !== 'PARTY_AND_SNACKS') return false;

        if (activeFlavor !== 'all' && item.flavor !== activeFlavor) return false;

        if (searchQuery) {
          const term = searchQuery.toLowerCase();
          const matchName = item.name.toLowerCase().includes(term);
          const matchFlv = item.flavor.toLowerCase().includes(term);
          if (!matchName && !matchFlv) return false;
        }

        return true;
      });

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card' + (item.section === 'STUDIO_SHOWCASE' ? ' studio-highlight' : '');

        let badgeClass = 'badge-ace';
        let badgeTxt = 'ACE';
        if (item.section === 'STUDIO_SHOWCASE') {
          badgeClass = 'badge-studio';
          badgeTxt = '★ STUDIO HERO';
        } else if (['Custom Specialty', 'Barbie Doll', 'Doraemon & Kids'].includes(item.flavor)) {
          badgeClass = 'badge-custom';
          badgeTxt = '🎨 1-ON-1 CUSTOM';
        } else if (item.category === 'PREMIUM') {
          badgeClass = 'badge-premium';
          badgeTxt = 'PREMIUM';
        } else if (item.section === 'PARTY_AND_SNACKS') {
          badgeClass = 'badge-party';
          badgeTxt = 'SUPPLIES';
        }

        card.innerHTML = `
          <div class="img-wrap" onclick="openPreview('${item.rel_path}', '${item.flavor} - ${item.name}')">
            <span class="card-badge ${badgeClass}">${badgeTxt}</span>
            <img src="${item.rel_path}" loading="lazy" alt="${item.name}">
          </div>
          <div class="card-body" onclick="openPreview('${item.rel_path}', '${item.flavor} - ${item.name}')">
            <div class="cake-flavor">${item.flavor}</div>
            <div class="file-name">${item.name}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        renderGrid();
      });
    });

    document.querySelectorAll('.flavor-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.flavor-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFlavor = btn.dataset.flavor;
        renderGrid();
      });
    });

    document.getElementById('search').addEventListener('input', e => {
      searchQuery = e.target.value.trim();
      renderGrid();
    });

    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modalImg');
    const modalCaption = document.getElementById('modalCaption');
    window.openPreview = function(src, cap) {
      modalImg.src = src;
      modalCaption.innerText = cap;
      modal.classList.add('open');
    };

    document.getElementById('closeModal').addEventListener('click', () => {
      modal.classList.remove('open');
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('open');
    });

    renderGrid();
  </script>
</body>
